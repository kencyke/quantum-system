name: Release

on:
  push:
    branches: [main]
    paths: [lean-toolchain]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Mathlib's convention (`leanprover-community/lean-release-tag`): every commit of the push that
      # changes `lean-toolchain` is tagged with the toolchain's version, so a push carrying several
      # switches yields several releases. Only Lean releases (`v4.x.y`, `v4.x.y-rcN`) are tagged; any
      # other toolchain is reported and skipped, without echoing the file into the log.
      # `gh release create --target` creates the tag and the release in one API call, so a tag never
      # exists without its release; an existing tag is used as is. The `gh release view` check only
      # skips releases that exist: should it fail for another reason, `create` fails loudly instead.
      - name: Tag and release each toolchain switch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$AFTER" # branch creation or force push: walk the whole history
          else
            range="$BEFORE..$AFTER"
          fi
          for commit in $(git log --reverse --format=%H "$range" -- lean-toolchain); do
            toolchain="$(git show "$commit:lean-toolchain")"
            if [[ ! "$toolchain" =~ ^leanprover/lean4:(v4\.[0-9]+\.[0-9]+(-rc[0-9]+)?)$ ]]; then
              echo "::warning::$commit: lean-toolchain is not a Lean release; not tagged"
              continue
            fi
            tag="${BASH_REMATCH[1]}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "release $tag already exists"
              continue
            fi
            flags=()
            if [[ "$tag" == *-rc* ]]; then flags=(--prerelease --latest=false); fi
            gh release create "$tag" --target "$commit" --title "$tag" --generate-notes "${flags[@]}"
          done
