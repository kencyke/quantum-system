name = "QuantumSystem"
version = "0.1.0"
defaultTargets = ["QuantumSystem"]

[[lean_lib]]
name = "QuantumSystem"
leanOptions.warningAsError = true
leanOptions.pp.unicode.fun = true
leanOptions.autoImplicit = false
